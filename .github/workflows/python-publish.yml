name: Build and Release Binaries

on:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build Windows binary
        run: flet build windows
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build macOS binary
        run: flet build macos
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos

  build-linux-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build Linux binary
        run: flet build linux
      - name: Build APK
        run: flet build apk
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk

  release:
    needs: [build-windows, build-macos, build-linux-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: build/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: build/macos
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: build/apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/**
            build/macos/**
            build/linux/**
            build/apk/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
