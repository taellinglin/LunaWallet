name: Build and Release Binaries

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set LANG for UTF-8
        run: setx LANG en_US.UTF-8
        shell: cmd
      - name: Set UTF-8 encoding
        run: chcp 65001
        shell: cmd
      - name: Set UTF-8 encoding env
        run: echo PYTHONIOENCODING=utf-8 >> %GITHUB_ENV%
        shell: cmd
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Workaround Dart.EXE.exe bug
        run: copy C:\hostedtoolcache\windows\flutter\stable-3.38.6-x64\bin\cache\dart-sdk\bin\dart.exe C:\hostedtoolcache\windows\flutter\stable-3.38.6-x64\bin\cache\dart-sdk\bin\dart.EXE.exe
        shell: cmd
      - name: Build Windows binary
        run: flet build windows
      - name: Set VERSION
        run: |
          $content = Get-Content "version_info.txt" -Raw
          $match = [regex]::Match($content, "ProductVersion', u'([^']+)'")
          $version = if ($match.Success) { $match.Groups[1].Value } else { "0.0.0" }
          $parts = $version.Split('.')
          if ($parts.Length -eq 4 -and $parts[3] -eq '0') { $version = "$($parts[0]).$($parts[1]).$($parts[2])" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: powershell
      - name: Package Windows build
        run: |
          if (Test-Path "build\\LunaWallet-$env:VERSION-Windows.zip") { Remove-Item "build\\LunaWallet-$env:VERSION-Windows.zip" }
          Compress-Archive -Path "build\\windows" -DestinationPath "build\\LunaWallet-$env:VERSION-Windows.zip"
        shell: powershell
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/LunaWallet-${{ env.VERSION }}-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Build macOS binary
        run: flet build macos
      - name: Set VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
              v = '.'.join(parts[:-1])
          print(f"VERSION={v}")
          PY
        shell: bash
      - name: Export VERSION
        run: |
          echo "$(python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
              v = '.'.join(parts[:-1])
          print(f"VERSION={v}")
          PY
          )" >> $GITHUB_ENV
      - name: Package macOS build
        run: |
          cd build
          if [ -d "macos/LunaWallet.app" ]; then
            zip -r "LunaWallet-${VERSION}-Macos.zip" "macos/LunaWallet.app"
          elif [ -d "macos/Build/Products/Release" ]; then
            APP_PATH=$(find macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              zip -r "LunaWallet-${VERSION}-Macos.zip" "$APP_PATH"
            else
              zip -r "LunaWallet-${VERSION}-Macos.zip" macos
            fi
          else
            zip -r "LunaWallet-${VERSION}-Macos.zip" macos
          fi
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/LunaWallet-${{ env.VERSION }}-Macos.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Install GTK 3
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Check Flutter version
        run: flutter --version
      - name: Build Linux binary
        run: flet build linux
      - name: Export VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
              v = '.'.join(parts[:-1])
          print(f"VERSION={v}")
          PY
          | tee -a $GITHUB_ENV
      - name: Package Linux build
        run: |
          cd build
          zip -r "LunaWallet-${VERSION}-Linux.zip" linux
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/LunaWallet-${{ env.VERSION }}-Linux.zip

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Export VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
              v = '.'.join(parts[:-1])
          print(f"VERSION={v}")
          PY
          | tee -a $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: List artifacts
        run: ls -la build
      - name: Create/Upload Release (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          working_directory: ${{ github.workspace }}
          command: |
            set -euo pipefail
            tag="${GITHUB_REF_NAME}"
            release_name="LunaWallet-v${VERSION}"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "$release_name" --notes "Automated release"
            fi
            gh release upload "$tag" build/*.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
