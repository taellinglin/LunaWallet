name: Build and Release Binaries

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
      - android
    tags:
      - '*'
  workflow_dispatch:
jobs:
  build-windows:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set LANG for UTF-8
        run: setx LANG en_US.UTF-8
        shell: cmd
      - name: Set UTF-8 encoding
        run: chcp 65001
        shell: cmd
      - name: Set UTF-8 encoding env
        run: echo PYTHONIOENCODING=utf-8 >> %GITHUB_ENV%
        shell: cmd
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Workaround Dart.EXE.exe bug
        run: copy C:\hostedtoolcache\windows\flutter\stable-3.38.6-x64\bin\cache\dart-sdk\bin\dart.exe C:\hostedtoolcache\windows\flutter\stable-3.38.6-x64\bin\cache\dart-sdk\bin\dart.EXE.exe
        shell: cmd
      - name: Build Windows binary
        run: flet build windows
      - name: Set VERSION
        run: |
          $content = Get-Content "version_info.txt" -Raw
          $match = [regex]::Match($content, "ProductVersion', u'([^']+)'")
          $version = if ($match.Success) { $match.Groups[1].Value } else { "0.0.0" }
          $parts = $version.Split('.')
          if ($parts.Length -eq 4 -and $parts[3] -eq '0') { $version = "$($parts[0]).$($parts[1]).$($parts[2])" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: powershell
      - name: Package Windows build
        run: |
          if (Test-Path "build\\LunaWallet-$env:VERSION-Windows.zip") { Remove-Item "build\\LunaWallet-$env:VERSION-Windows.zip" }
          Compress-Archive -Path "build\\windows" -DestinationPath "build\\LunaWallet-$env:VERSION-Windows.zip"
        shell: powershell
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/LunaWallet-${{ env.VERSION }}-Windows.zip

  build-macos:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Build macOS binary
        run: bash build_macos.sh
      - name: Remove macOS debug symbols
        run: |
          find build/macos -name "*.dSYM" -type d -print0 | xargs -0 rm -rf || true
      - name: Set VERSION
        run: |
          python - <<'PY'
          import os
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
              v = '.'.join(parts[:-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={v}\n")
          PY
        shell: bash
      - name: Package macOS build
        run: |
          cd build
          if [ -d "macos/LunaWallet.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "macos/LunaWallet.app" "LunaWallet-${VERSION}-Macos.zip"
          elif [ -d "macos/Build/Products/Release" ]; then
            APP_PATH=$(find macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "LunaWallet-${VERSION}-Macos.zip"
            else
              echo "No .app found in macos/Build/Products/Release"
              ls -la macos/Build/Products/Release || true
              exit 1
            fi
          else
            echo "No macOS app output found"
            ls -la macos || true
            exit 1
          fi
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/LunaWallet-${{ env.VERSION }}-Macos.zip

  build-linux:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Remove simpleaudio for Linux/Android build
        run: sed -i '/^simpleaudio/d' requirements.txt
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Install GTK 3 + ALSA + build tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev pkg-config build-essential clang python3-dev
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Check Flutter version
        run: flutter --version
      - name: Build Linux binary
        run: flet build linux
      - name: Export VERSION
        run: |
          python - <<'PY'
          import os
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - name: Package Linux build
        run: |
          cd build
          zip -r "LunaWallet-${VERSION}-Linux.zip" linux
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/LunaWallet-${{ env.VERSION }}-Linux.zip

  build-android:
    if: github.ref == 'refs/heads/android' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Export VERSION
        run: |
          python - <<'PY'
          import os
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - name: Remove simpleaudio for Android build
        run: |
          sed -i '/^simpleaudio/d' requirements.txt
      - name: Build Android APK (release)
        run: |
          flet build apk
          python scripts/patch_android_proguard.py
          pushd build/flutter
          flutter build apk --release
          popd
      - name: Package Android build
        run: |
          mkdir -p build
          APK_PATH="build/flutter/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "build/LunaWallet-${VERSION}-Android.apk"
          else
            echo "Android APK not found at $APK_PATH"
            find build/flutter -maxdepth 6 -type f -name "*.apk" -print || true
            exit 1
          fi
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/LunaWallet-${{ env.VERSION }}-Android.apk

  build-ios:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Export VERSION
        run: |
          python - <<'PY'
          import os
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - name: Build iOS (no codesign)
        run: |
          flet build ipa
          pushd build/flutter
          flutter build ipa --no-codesign
          popd
      - name: Package iOS build
        run: |
          mkdir -p build
          IPA_PATH=$(find build/flutter/build/ios/ipa -maxdepth 1 -type f -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            cp "$IPA_PATH" "build/LunaWallet-${VERSION}-iOS.ipa"
          else
            echo "iOS IPA not found"
            find build/flutter/build/ios -maxdepth 4 -type f -name "*.ipa" -print || true
            exit 1
          fi
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/LunaWallet-${{ env.VERSION }}-iOS.ipa

  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: List artifacts
        run: |
          mkdir -p build
          ls -la build || true
      - name: Export VERSION
        run: |
          python - <<'PY'
          import os
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - name: Create/Upload Release (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          shell: bash
          command: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            if [ -z "${VERSION:-}" ]; then
              VERSION=$(python -c "import re; p=open('version_info.txt',encoding='utf-8').read(); m=re.search(r\"ProductVersion', u'([^']+)'\", p); v=m.group(1) if m else '0.0.0'; parts=v.split('.'); v='.'.join(parts[:-1]) if len(parts)==4 and parts[-1]=='0' else v; print(v)")
            fi
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v${VERSION}"
            fi
            release_name="LunaWallet-v${VERSION}"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "$release_name" --notes "Automated release" --target "$GITHUB_SHA"
            fi
            mapfile -t files < <(find build -maxdepth 2 \( -name "*.zip" -o -name "*.apk" -o -name "*.ipa" \) -print)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No release artifacts found under build/. Skipping release upload."
              ls -la build || true
              exit 0
            fi
            uploaded_files=()
            for f in "${files[@]}"; do
              size=$(stat -c%s "$f" || echo 0)
              if [ "$size" -gt 2147483648 ]; then
                echo "Asset too large, splitting: $f ($size bytes)"
                split_dir="${f}.parts"
                mkdir -p "$split_dir"
                split -b 1900m -d -a 3 "$f" "$split_dir/$(basename "$f").part"
                mapfile -t parts < <(find "$split_dir" -type f -print | sort)
                uploaded_files+=("${parts[@]}")
              else
                uploaded_files+=("$f")
              fi
            done
            gh release upload "$tag" "${uploaded_files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
