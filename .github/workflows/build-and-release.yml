name: Build and Release Binaries

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
      - android
    tags:
      - '*'
  workflow_dispatch:
jobs:
  build-windows:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set LANG for UTF-8
        run: setx LANG en_US.UTF-8
        shell: cmd
      - name: Set UTF-8 encoding
        run: chcp 65001
        shell: cmd
      - name: Set UTF-8 encoding env
        run: echo PYTHONIOENCODING=utf-8 >> %GITHUB_ENV%
        shell: cmd
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Workaround Dart.EXE.exe bug
        run: copy C:\hostedtoolcache\windows\flutter\stable-3.38.6-x64\bin\cache\dart-sdk\bin\dart.exe C:\hostedtoolcache\windows\flutter\stable-3.38.6-x64\bin\cache\dart-sdk\bin\dart.EXE.exe
        shell: cmd
      - name: Build Windows binary
        run: flet build windows
      - name: Set VERSION
        run: |
          $content = Get-Content "version_info.txt" -Raw
          $match = [regex]::Match($content, "ProductVersion', u'([^']+)'")
          $version = if ($match.Success) { $match.Groups[1].Value } else { "0.0.0" }
          $parts = $version.Split('.')
          if ($parts.Length -eq 4 -and $parts[3] -eq '0') { $version = "$($parts[0]).$($parts[1]).$($parts[2])" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: powershell
      - name: Package Windows build
        run: |
          if (Test-Path "build\\LunaWallet-$env:VERSION-Windows.zip") { Remove-Item "build\\LunaWallet-$env:VERSION-Windows.zip" }
          Compress-Archive -Path "build\\windows" -DestinationPath "build\\LunaWallet-$env:VERSION-Windows.zip"
        shell: powershell
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/LunaWallet-${{ env.VERSION }}-Windows.zip

  build-macos:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Build macOS binary
        run: bash build_macos.sh
      - name: Remove macOS debug symbols
        run: |
          find build/macos -name "*.dSYM" -type d -print0 | xargs -0 rm -rf || true
      - name: Set VERSION
        run: |
          python - <<'PY'
          import os
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
              v = '.'.join(parts[:-1])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={v}\n")
          PY
        shell: bash
      - name: Package macOS build
        run: |
          cd build
          if [ -d "macos/LunaWallet.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "macos/LunaWallet.app" "LunaWallet-${VERSION}-Macos.zip"
          elif [ -d "macos/Build/Products/Release" ]; then
            APP_PATH=$(find macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "LunaWallet-${VERSION}-Macos.zip"
            else
              echo "No .app found in macos/Build/Products/Release"
              ls -la macos/Build/Products/Release || true
              exit 1
            fi
          else
            echo "No macOS app output found"
            ls -la macos || true
            exit 1
          fi
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/LunaWallet-${{ env.VERSION }}-Macos.zip

  build-linux:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Install GTK 3 + ALSA + build tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev pkg-config build-essential clang python3-dev
      - name: Add Flutter to PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Check Flutter version
        run: flutter --version
      - name: Build Linux binary
        run: flet build linux
      - name: Export VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open("$GITHUB_ENV", "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - name: Package Linux build
        run: |
          cd build
          zip -r "LunaWallet-${VERSION}-Linux.zip" linux
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/LunaWallet-${{ env.VERSION }}-Linux.zip

  build-android:
    if: github.ref == 'refs/heads/android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Export VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open("$GITHUB_ENV", "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - name: Remove simpleaudio for Android build
        run: |
          sed -i '/^simpleaudio/d' requirements.txt
      - name: Build Android APK (Flet)
        run: flet build apk
      - name: Enable ProGuard/R8 (Android)
        run: python scripts/patch_android_proguard.py
      - name: Set SERIOUS_PYTHON_SITE_PACKAGES
        run: |
          set -euo pipefail
          PY_DIR=$(find build/flutter/build -maxdepth 2 -type d -name "build_python_*" | head -n 1 || true)
          if [ -z "$PY_DIR" ]; then
            echo "build_python_* not found under build/flutter/build"
            find build/flutter/build -maxdepth 3 -type d | head -n 200 || true
            exit 1
          fi
          if [ -d "$PY_DIR/python/lib" ]; then
            SITE_PACKAGES=$(find "$PY_DIR/python/lib" -maxdepth 2 -type d -name "site-packages" | head -n 1)
          else
            SITE_PACKAGES=$(find "$PY_DIR/python/Lib" -maxdepth 2 -type d -name "site-packages" | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "site-packages not found under $PY_DIR/python"
            find "$PY_DIR/python" -maxdepth 3 -type d | head -n 200 || true
            exit 1
          fi
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV
      - name: Rebuild APK with ProGuard
        run: |
          cd build/flutter
          flutter build apk --release
      - name: Package APK
        run: |
          APK_PATH=$(find build -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in build/"
            find build -type f -maxdepth 4 | head -n 200 || true
            exit 1
          fi
          cp "$APK_PATH" "build/LunaWallet-${VERSION}-Android.apk"
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/LunaWallet-${{ env.VERSION }}-Android.apk

  release-android:
    if: github.ref == 'refs/heads/android'
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open("$GITHUB_ENV", "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: List artifacts
        run: ls -la build
      - name: Create/Upload Android Release
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          shell: bash
          command: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            if [ -z "${VERSION:-}" ]; then
              VERSION=$(python -c "import re; p=open('version_info.txt',encoding='utf-8').read(); m=re.search(r\"ProductVersion', u'([^']+)'\", p); v=m.group(1) if m else '0.0.0'; parts=v.split('.'); v='.'.join(parts[:-1]) if len(parts)==4 and parts[-1]=='0' else v; print(v)")
            fi
            tag="android-v${VERSION}"
            release_name="LunaWallet-Android-v${VERSION}"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "$release_name" --notes "Android release" --target "$GITHUB_SHA"
            fi
            mapfile -t files < <(find build -maxdepth 2 -name "*.apk" -print)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No apk artifacts found under build/"
              ls -la build || true
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export VERSION
        run: |
          python - <<'PY'
          import re
          p = open('version_info.txt', encoding='utf-8').read()
          m = re.search(r"ProductVersion', u'([^']+)'", p)
          v = m.group(1) if m else '0.0.0'
          parts = v.split('.')
          if len(parts) == 4 and parts[-1] == '0':
            v = '.'.join(parts[:-1])
          with open("$GITHUB_ENV", "a", encoding="utf-8") as f:
            f.write(f"VERSION={v}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: List artifacts
        run: ls -la build
      - name: Create/Upload Release (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          shell: bash
          command: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            if [ -z "${VERSION:-}" ]; then
              VERSION=$(python -c "import re; p=open('version_info.txt',encoding='utf-8').read(); m=re.search(r\"ProductVersion', u'([^']+)'\", p); v=m.group(1) if m else '0.0.0'; parts=v.split('.'); v='.'.join(parts[:-1]) if len(parts)==4 and parts[-1]=='0' else v; print(v)")
            fi
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v${VERSION}"
            fi
            release_name="LunaWallet-v${VERSION}"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "$release_name" --notes "Automated release" --target "$GITHUB_SHA"
            fi
            mapfile -t files < <(find build -maxdepth 2 -name "*.zip" -print)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No zip artifacts found under build/"
              ls -la build || true
              exit 1
            fi
            uploaded_files=()
            for f in "${files[@]}"; do
              size=$(stat -c%s "$f" || echo 0)
              if [ "$size" -gt 2147483648 ]; then
                echo "Asset too large, splitting: $f ($size bytes)"
                split_dir="${f}.parts"
                mkdir -p "$split_dir"
                split -b 1900m -d -a 3 "$f" "$split_dir/$(basename "$f").part"
                mapfile -t parts < <(find "$split_dir" -type f -print | sort)
                uploaded_files+=("${parts[@]}")
              else
                uploaded_files+=("$f")
              fi
            done
            gh release upload "$tag" "${uploaded_files[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
